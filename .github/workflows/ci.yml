name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, core tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p ironweaver-core
      - name: bincode 1.x is not a dependency
        run: |
          if cargo tree --workspace -e all | grep -q "bincode v1"; then
            echo "bincode 1.x must not be a dependency (RUSTSEC-2025-0141)" >&2
            exit 1
          fi
      - name: The core does not depend on pyo3
        run: |
          if cargo tree -p ironweaver-core -e normal | grep -q pyo3; then
            echo "ironweaver-core must not depend on pyo3" >&2
            exit 1
          fi

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the minimum Rust version from both crates
        id: msrv
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          manifests = [Path("Cargo.toml"), Path("crates/ironweaver-core/Cargo.toml")]
          versions = [tomllib.loads(path.read_text())["package"]["rust-version"] for path in manifests]
          if versions[0] != versions[1]:
              raise SystemExit(f"Both crates must declare the same rust-version: {versions}")
          version = versions[0]
          if version.count(".") == 1:
              version += ".0"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"rust-version={version}\n")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test -p ironweaver-core

  docs-rs:
    name: Core API docs (rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p ironweaver-core --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: The crate packages for crates.io
        run: cargo package -p ironweaver-core

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ignored advisories are listed, with reasons, in .cargo/audit.toml
      - run: cargo audit

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          python -m pip install -e ".[test]"
      # Includes tests/test_docs_examples.py (README, llms.txt, docs/*.md)
      - run: python -m pytest -q
      - name: Windows atomic-save regression tests
        if: runner.os == 'Windows'
        run: cargo test -p ironweaver-core --test format_safety write_atomic
