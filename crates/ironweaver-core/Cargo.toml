[package]
name = "ironweaver-core"
version = "0.2.0"
edition = "2021"
description = "Directed property graph and graph algorithms behind ironweaver (pure Rust, no Python)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sonic-rs = "0.5"
bincode = "1.3"
postcard = { version = "1", default-features = false, features = ["use-std"] }
crc32fast = "1"
chrono = { version = "0.4", features = ["serde"] }
half = { version = "2.2", features = ["serde"] }
rand = "0.8"
rayon = "1.10"
foldhash = "0.2"
