[workspace]
members = ["crates/ironweaver-core"]

# The Python extension module: PyO3 bindings over `ironweaver-core`.
[package]
name = "ironweaver"
version = "0.2.0"
edition = "2021"
publish = false  # released on PyPI as a Python package, not on crates.io
rust-version = "1.85"
description = "Python bindings (PyO3) for ironweaver-core"
license = "MIT"
repository = "https://github.com/p-sodmann/Ironweaver"

[lib]
name = "_ironweaver"
crate-type = ["cdylib"]

[dependencies]
ironweaver-core = { path = "crates/ironweaver-core", version = "0.2.0" }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = "1.0"
sonic-rs = "0.5"
half = "2.2"
