[workspace]
members = ["crates/ironweaver-core"]

# Shared versions live here; each crate opts into the features it needs.
[workspace.dependencies]
half = "2.2"
rayon = "1.10"
serde = "1.0"
sonic-rs = "0.5"

# The Python extension module: PyO3 bindings over `ironweaver-core`.
[package]
name = "ironweaver"
version = "0.2.0"
edition = "2024"
publish = false  # released on PyPI as a Python package, not on crates.io
rust-version = "1.99"
description = "Python bindings (PyO3) for ironweaver-core"
license = "MIT"
repository = "https://github.com/p-sodmann/Ironweaver"

[lib]
name = "_ironweaver"
crate-type = ["cdylib"]

[dependencies]
ironweaver-core = { path = "crates/ironweaver-core", version = "0.2.0" }
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon.workspace = true
serde.workspace = true
sonic-rs.workspace = true
half.workspace = true

# Release wheels (maturin build --profile dist): slower to build, faster to run
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
