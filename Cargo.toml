[workspace]
members = ["crates/ironweaver-core"]

# The Python extension module: PyO3 bindings over `ironweaver-core`.
[package]
name = "ironweaver"
version = "0.1.0"
edition = "2021"

[lib]
name = "_ironweaver"
crate-type = ["cdylib"]

[dependencies]
ironweaver-core = { path = "crates/ironweaver-core" }
pyo3 = { version = "0.25", features = ["extension-module"] }
serde = "1.0"
sonic-rs = "0.5"
half = "2.2"
