site_name: ironweaver
site_description: A fast property graph library for Python, with its engine in Rust
site_url: https://p-sodmann.github.io/Ironweaver/
repo_url: https://github.com/p-sodmann/Ironweaver
repo_name: p-sodmann/Ironweaver
edit_uri: edit/main/docs/
copyright: Copyright © 2025 Philipp Sodmann, MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Guide:
      - Graphs, nodes and edges: basics.md
      - Filtering: filtering.md
      - Traversal and paths: traversal.md
      - Analytics: analytics.md
      - Pattern matching: patterns.md
      - Callbacks: callbacks.md
      - LGF text format: LGF.md
      - File format: format.md
  - API reference: api.md
  - Benchmarks: benchmarks.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      # GitHub-style anchors, so links between the docs work on GitHub too
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # The API is documented by the type stubs (the classes are compiled)
          paths: [python]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]
            merge_init_into_class: true
